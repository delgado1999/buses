<div class="login-container">
  <div class="login-box">
    <form (ngSubmit)="login()">
      <h2>Iniciar Sesión</h2>

      <div class="form-group">
        <input
          type="email"
          placeholder="Email"
          [(ngModel)]="email"
          name="email"
          required
        />
      </div>

      <div class="form-group">
        <input
          type="password"
          placeholder="Contraseña"
          [(ngModel)]="password"
          name="password"
          required
        />
      </div>

      <button type="submit">Ingresar</button>

      <p class="error" *ngIf="error">{{ error }}</p>
    </form>
  </div>
</div>
